<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="style.css" rel="stylesheet">
</head>
<body>
	 <header>
    <nav class="navbar navbar-expand-lg bg-dark fixed-top">
      <div class="container">
        <a class="navbar-brand" href="index.html"> Gusheshe <span>Spinning<span> </a>
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu"
                arial-label="Open menu">

                <span class="navbar-toggler-icon"></span>

          



        </button>

          <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link" href="index.html"> Home </a>
                <li class="nav-item">
                <a class="nav-link " href="spots.html"> Spots </a>
                <li class="nav-item">
                <a class="nav-link" href="collect.html"> Collection </a>
                <li class="nav-item">
                <a class="nav-link" href="gallery.html"> Gallery </a>
                <li class="nav-item">
                <a class="nav-link active" href="contact.html"> Contact </a>
                <li class="nav-item">
                <button id="mode" class="btn btn-outline-danger btn-sm ms-lg-3"> Dark Mode </button>

    </nav>



  </header>
  <main>
    <section class="page-title mt-5 pt-3">
      <div class="container">
        <h1>Contact and Booking</h1>
        <p class="mb-0">Send us a message or book your place.</p>
      </div>
    </section>

    <section>
      <div class="container">
        <div id="welcome"></div>
        <div id="lastBooking"></div>

        <div class="row">

          <div class="col-md-6 mb-4">
            <h2>Send a message</h2>
            <form id="contactForm" novalidate>
              <div class="mb-3">
                <label for="cName" class="form-label">Your name</label>
                <input type="text" id="cName" class="form-control" required>
                <div class="invalid-feedback"></div>
              </div>
              <div class="mb-3">
                <label for="cEmail" class="form-label">Email</label>
                <input type="email" id="cEmail" class="form-control" required>
                <div class="invalid-feedback"></div>
              </div>
              <div class="mb-3">
                <label for="cMessage" class="form-label">Message</label>
                <textarea id="cMessage" rows="4" class="form-control" required></textarea>
                <div class="invalid-feedback"></div>
              </div>
              <div id="contactResult"></div>
              <button type="submit" class="btn btn-danger">Send</button>
            </form>
          </div>

       
          <div class="col-md-6 mb-4">
            <h2>Book your place</h2>
            <form id="bookingForm">
              <div class="mb-3">
                <label>Your name</label>
                <input type="text" id="bName" class="form-control" required>
                <div class="invalid-feedback"></div>
              </div>
              <div class="mb-3">
                <label>Email</label>
                <input type="email" id="bEmail" class="form-control" required>
                <div class="invalid-feedback"></div>
              </div>
              <div class="mb-3">
                <label>Phone</label>
                <input type="tel" id="bPhone" class="form-control" placeholder="+266...." required>
                <div class="invalid-feedback"></div>
              </div>
              <div class="mb-3">
                <label>Date</label>
                <input type="date" id="bDate" class="form-control" required>
                <div class="invalid-feedback"></div>
              </div>
              <div class="mb-3">
                <label>Spin spot</label>
           
                <select id="bSpot" class="form-select" required>
                  <option value="">Choose a spot...</option>
                  <option value="150">Maseru City(M150)</option>
                  <option value="120">Maputsoe Open Ground (M120)</option>
                  <option value="200">Mafeteng Arena (M200)</option>
                  <option value="180">Leribe Night Meet (M180)</option>
                  <option value="160">TY Practice Track (M160)</option>
                  <option value="110">Mohale's Hoek Pan (M110)</option>
                </select>
                <div class="invalid-feedback"></div>
              </div>
              <div class="mb-3">
                <label>Ticket type</label>
                <select id="bTicket" class="form-select">
                  <option value="0">General (+M0)</option>
                  <option value="150">VIP front row (+M150)</option>
                  <option value="120">Passenger ride (+M120)</option>
                  <option value="60">Photo pass (+M60)</option>
                </select>
              </div>
              <div class="mb-3">
                <label>Number of people</label>
                <input type="number" id="bPeople" class="form-control" min="1" max="20" value="1" required>
                <div class="invalid-feedback"></div>
              </div>

              <div class="total-box mb-3">
                Total price: <strong id="bTotal">M0</strong>
                <div id="bNote" class="small"></div>
              </div>

              <div id="bookingResult"></div>
              <button type="submit" class="btn btn-danger">Confirm booking</button>
            </form>
          </div>

        </div>
      </div>
    </section>
  </main>

 

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
