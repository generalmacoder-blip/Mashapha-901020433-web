<head>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
      <div class="container">
        <a class="navbar-brand" href="index.html">GUSHESHE</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Open menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="spots.html">Spin Spots</a></li>
            <li class="nav-item"><a class="nav-link" href="stay.html">Accommodation</a></li>
             <li class="nav-item"><a class="nav-link" href="photos.html">Gallery</a></li>
            <li class="nav-item"><a class="nav-link" href="moreInfo.html">Contact / Book</a></li>
            <li class="nav-item"><button id="themeBtn" class="btn btn-outline-warning btn-sm ms-lg-3" type="button">Dark mode</button></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section class="page-title">
      <div class="container">
        <h1>Photo Gallery</h1>
        <p class="mb-0">Click a picture to see it bigger.</p>
      </div>
    </section>

    <section>
      <div class="container">
        <div class="row">

         
          <div class="col-6 col-md-4 mb-3">
            <img src="gusheshe.jpg"  class="gallery-img">
          </div>
          <div class="col-6 col-md-4 mb-3">
            <img src="images/gusheshe1.jpg"  class="gallery-img">
          </div>
          <div class="col-6 col-md-4 mb-3">
            <img src="red.jpg"  class="gallery-img">
          </div>
          <div class="col-6 col-md-4 mb-3">
            <img src="me.jpg"  class="gallery-img">
          </div>
          <div class="col-6 col-md-4 mb-3">
            <img src="pink.webp"  class="gallery-img">
          </div>
          <div class="col-6 col-md-4 mb-3">
            <img src="byk.jpg"  class="gallery-img">
          </div>

        </div>
      </div>
    </section>
  </main>

 
  <div class="modal fade" id="pictureModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="bigCaption"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body text-center">
          <img id="bigPicture" src="" alt="" class="img-fluid">
        </div>
        <div class="modal-footer justify-content-between">
          <button id="prevBtn" type="button" class="btn btn-orange">Previous</button>
          <button id="nextBtn" type="button" class="btn btn-orange">Next</button>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <div class="container">
      <p class="mb-1">Gusheshe Lesotho - Maseru, Lesotho</p>
     
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
